<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Dr. KAMBALE MONDO</title>
    <meta name="description" content="Article du Dr. KAMBALE MONDO">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- Prevent flash of wrong theme -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-off-white dark:bg-dark-bg text-charcoal dark:text-gray-100 antialiased transition-colors duration-300"
    x-data x-init="$store.theme.init()">

    <!-- Header & Navigation -->
    <header x-data="headerComponent"
        class="sticky top-0 z-50 bg-white/95 dark:bg-dark-card/95 backdrop-blur-sm border-b border-gray-100 dark:border-dark-border transition-colors duration-300">
        <nav class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a :href="basePath + 'index.html'" class="text-2xl font-bold tracking-tight">
                    <span class="text-charcoal dark:text-white">KM</span><span class="text-accent-orange">.</span>
                </a>

                <div class="hidden md:flex items-center space-x-8">
                    <a :href="basePath + 'index.html'"
                        :class="isActive('index.html') ? 'nav-link-active' : 'nav-link-inactive'"
                        class="nav-link">Accueil</a>
                    <a :href="basePath + 'pages/blog.html'"
                        :class="isActive('blog.html') ? 'nav-link-active' : 'nav-link-inactive'"
                        class="nav-link">Blog</a>
                    <a :href="basePath + 'pages/about.html'"
                        :class="isActive('about.html') ? 'nav-link-active' : 'nav-link-inactive'" class="nav-link">À
                        Propos</a>
                    <a :href="basePath + 'pages/contact.html'"
                        :class="isActive('contact.html') ? 'nav-link-active' : 'nav-link-inactive'"
                        class="nav-link">Contact</a>

                    <button @click="$store.theme.toggle()"
                        class="flex items-center gap-2 px-4 py-2 rounded-sm text-steel dark:text-gray-400 hover:text-accent-orange dark:hover:text-accent-orange hover:bg-gray-100 dark:hover:bg-dark-border transition-colors border border-gray-200 dark:border-dark-border"
                        aria-label="Toggle theme">
                        <svg x-show="$store.theme.darkMode" x-cloak class="w-5 h-5" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5" stroke-width="2" />
                            <path stroke-linecap="round" stroke-width="2"
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                        <svg x-show="!$store.theme.darkMode" class="w-5 h-5" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                        <span class="text-sm font-medium" x-text="$store.theme.darkMode ? 'Clair' : 'Sombre'"></span>
                    </button>
                </div>

                <div class="flex items-center gap-2 md:hidden">
                    <button @click="$store.theme.toggle()"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-charcoal dark:text-gray-300 hover:text-accent-orange transition-colors border border-gray-200 dark:border-dark-border rounded-sm"
                        aria-label="Toggle theme">
                        <svg x-show="$store.theme.darkMode" x-cloak class="w-4 h-4" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5" stroke-width="2" />
                            <path stroke-linecap="round" stroke-width="2"
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                        <svg x-show="!$store.theme.darkMode" class="w-4 h-4" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                        <span class="text-xs font-medium" x-text="$store.theme.darkMode ? 'Clair' : 'Sombre'"></span>
                    </button>
                    <button @click="toggleMobileMenu"
                        class="p-2 text-charcoal dark:text-gray-300 hover:text-accent-orange transition-colors"
                        aria-label="Toggle menu">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
                class="md:hidden pb-6" @click.away="mobileMenuOpen = false">
                <a :href="basePath + 'index.html'"
                    :class="isActive('index.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Accueil</a>
                <a :href="basePath + 'pages/blog.html'"
                    :class="isActive('blog.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Blog</a>
                <a :href="basePath + 'pages/about.html'"
                    :class="isActive('about.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">À Propos</a>
                <a :href="basePath + 'pages/contact.html'"
                    :class="isActive('contact.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Article Detail Page -->
    <main x-data="articleDetailComponent" class="py-20">
        <article class="max-w-4xl mx-auto px-6 lg:px-8">
            <!-- Breadcrumb -->
            <nav class="mb-8 text-sm">
                <a href="blog.html" class="text-steel dark:text-gray-400 hover:text-accent-orange transition-colors">←
                    Retour aux articles</a>
            </nav>

            <!-- Article Header -->
            <header class="mb-12 fade-in">
                <div class="flex items-center gap-4 mb-6">
                    <span
                        class="text-xs px-3 py-1 bg-accent-orange/10 text-accent-orange font-semibold rounded-full uppercase tracking-wide"
                        x-text="article.category"></span>
                    <span class="text-steel dark:text-gray-400 text-sm" x-text="article.readTime"></span>
                </div>

                <h1 class="text-4xl lg:text-5xl font-bold leading-tight mb-6" x-text="article.title"></h1>

                <div class="flex items-center gap-4 text-steel dark:text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span x-text="formatDate(article.date)"></span>
                </div>
            </header>

            <!-- Featured Image -->
            <div class="aspect-video bg-gradient-to-br from-steel to-charcoal rounded-sm overflow-hidden mb-12">
                <img :src="'../' + article.image" :alt="article.title" class="w-full h-full object-cover"
                    onerror="this.style.display='none'">
            </div>

            <!-- Article Content -->
            <div class="prose prose-lg max-w-none dark:prose-invert mb-16">
                <div class="text-lg text-steel dark:text-gray-300 leading-relaxed space-y-6"
                    x-html="article.fullContent"></div>
            </div>

            <!-- Tags -->
            <div class="flex flex-wrap gap-3 mb-12 pb-12 border-b border-gray-200 dark:border-dark-border">
                <template x-for="tag in article.tags" :key="tag">
                    <a :href="'blog.html?tag=' + tag"
                        class="px-4 py-2 bg-off-white dark:bg-dark-card border border-gray-200 dark:border-dark-border rounded-sm text-sm font-medium text-steel dark:text-gray-400 hover:border-accent-orange hover:text-accent-orange transition-colors"
                        x-text="tag"></a>
                </template>
            </div>

            <!-- Author Box -->
            <div class="card p-8 mb-12">
                <div class="flex items-center gap-6">
                    <div
                        class="w-20 h-20 bg-gradient-to-br from-steel to-charcoal rounded-full overflow-hidden flex-shrink-0">
                        <img :src="'../' + profile.photo" :alt="profile.fullName" class="w-full h-full object-cover"
                            onerror="this.style.display='none'">
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-1" x-text="profile.fullName"></h3>
                        <p class="text-steel dark:text-gray-400 mb-2" x-text="profile.title"></p>
                        <p class="text-sm text-steel dark:text-gray-400" x-text="profile.institution"></p>
                    </div>
                </div>
            </div>

            <!-- Related Articles -->
            <section x-show="relatedArticles.length > 0">
                <h2 class="section-title mb-8">Articles Similaires</h2>
                <div class="grid md:grid-cols-2 gap-8">
                    <template x-for="relatedArticle in relatedArticles" :key="relatedArticle.id">
                        <article class="card hover-lift group">
                            <a :href="'article.html?id=' + relatedArticle.id"
                                class="block aspect-video bg-gradient-to-br from-steel to-charcoal overflow-hidden">
                                <img :src="'../' + relatedArticle.image" :alt="relatedArticle.title"
                                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                    onerror="this.style.display='none'">
                            </a>
                            <div class="p-6">
                                <div class="text-sm text-steel dark:text-gray-400 mb-2"
                                    x-text="formatDate(relatedArticle.date)"></div>
                                <a :href="'article.html?id=' + relatedArticle.id">
                                    <h3 class="text-lg font-bold group-hover:text-accent-orange transition-colors line-clamp-2"
                                        x-text="relatedArticle.title"></h3>
                                </a>
                            </div>
                        </article>
                    </template>
                </div>
            </section>
        </article>
    </main>

    <!-- Footer -->
    <footer x-data="footerComponent" class="bg-charcoal text-white py-16">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="grid md:grid-cols-3 gap-12 mb-12">
                <div class="space-y-4">
                    <h3 class="text-2xl font-bold">
                        <span>KM</span><span class="text-accent-orange">.</span>
                    </h3>
                    <p class="text-gray-400 leading-relaxed" x-text="profile.tagline"></p>
                </div>

                <div class="space-y-4">
                    <h4 class="font-semibold text-lg">Navigation</h4>
                    <ul class="space-y-2">
                        <li><a :href="basePath + 'index.html'"
                                class="text-gray-400 hover:text-accent-orange transition-colors">Accueil</a></li>
                        <li><a :href="basePath + 'pages/blog.html'"
                                class="text-gray-400 hover:text-accent-orange transition-colors">Blog</a></li>
                        <li><a :href="basePath + 'pages/about.html'"
                                class="text-gray-400 hover:text-accent-orange transition-colors">À Propos</a></li>
                        <li><a :href="basePath + 'pages/contact.html'"
                                class="text-gray-400 hover:text-accent-orange transition-colors">Contact</a></li>
                    </ul>
                </div>

                <div class="space-y-4">
                    <h4 class="font-semibold text-lg">Contact</h4>
                    <ul class="space-y-3 text-gray-400">
                        <li x-text="profile.institution"></li>
                        <li x-text="profile.email"></li>
                        <li x-text="profile.location"></li>
                    </ul>
                </div>
            </div>

            <div class="pt-8 border-t border-gray-800 flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-gray-400 text-sm">
                    © <span x-text="currentYear"></span> Dr. KAMBALE MONDO. Tous droits réservés.
                </p>
                <div class="flex gap-6">
                    <template x-for="link in siteData.social" :key="link.platform">
                        <a :href="link.url" :aria-label="link.platform"
                            class="text-gray-400 hover:text-accent-orange transition-colors" x-html="link.icon">
                        </a>
                    </template>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="../js/app.js"></script>
</body>

</html>
