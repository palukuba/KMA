<!-- Header Component - Dr. KAMBALE MONDO -->
<!-- Usage: Include via x-data="headerLoader" -->

<header x-data="headerComponent"
    class="sticky top-0 z-50 bg-white/95 dark:bg-dark-card/95 backdrop-blur-sm border-b border-gray-100 dark:border-dark-border transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <!-- Logo -->
            <a :href="basePath + 'index.html'" class="text-2xl font-bold tracking-tight">
                <span class="text-charcoal dark:text-white">KM</span><span class="text-accent-orange">.</span>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center space-x-8">
                <a :href="basePath + 'index.html'"
                    :class="isActive('index.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="nav-link">Accueil</a>
                <a :href="basePath + 'pages/blog.html'"
                    :class="isActive('blog.html') ? 'nav-link-active' : 'nav-link-inactive'" class="nav-link">Blog</a>
                <a :href="basePath + 'pages/about.html'"
                    :class="isActive('about.html') ? 'nav-link-active' : 'nav-link-inactive'" class="nav-link">À
                    Propos</a>
                <a :href="basePath + 'pages/contact.html'"
                    :class="isActive('contact.html') ? 'nav-link-active' : 'nav-link-inactive'"
                    class="nav-link">Contact</a>

                <!-- Theme Toggle Button -->
                <button @click="$store.theme.toggle()"
                    class="flex items-center gap-2 px-4 py-2 rounded-sm text-steel dark:text-gray-400 hover:text-accent-orange dark:hover:text-accent-orange hover:bg-gray-100 dark:hover:bg-dark-border transition-colors border border-gray-200 dark:border-dark-border"
                    aria-label="Toggle theme">
                    <!-- Sun Icon (show in dark mode) -->
                    <svg x-show="$store.theme.darkMode" x-cloak class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" stroke-width="2" />
                        <path stroke-linecap="round" stroke-width="2"
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                    <!-- Moon Icon (show in light mode) -->
                    <svg x-show="!$store.theme.darkMode" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    <span class="text-sm font-medium" x-text="$store.theme.darkMode ? 'Clair' : 'Sombre'"></span>
                </button>
            </div>

            <!-- Mobile: Theme Toggle + Menu Button -->
            <div class="flex items-center gap-2 md:hidden">
                <!-- Mobile Theme Toggle -->
                <button @click="$store.theme.toggle()"
                    class="flex items-center gap-1.5 px-3 py-1.5 text-charcoal dark:text-gray-300 hover:text-accent-orange transition-colors border border-gray-200 dark:border-dark-border rounded-sm"
                    aria-label="Toggle theme">
                    <svg x-show="$store.theme.darkMode" x-cloak class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" stroke-width="2" />
                        <path stroke-linecap="round" stroke-width="2"
                            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                    <svg x-show="!$store.theme.darkMode" class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                    <span class="text-xs font-medium" x-text="$store.theme.darkMode ? 'Clair' : 'Sombre'"></span>
                </button>

                <!-- Mobile Menu Button -->
                <button @click="toggleMobileMenu"
                    class="p-2 text-charcoal dark:text-gray-300 hover:text-accent-orange transition-colors"
                    aria-label="Toggle menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                        <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-2" class="md:hidden pb-6"
            @click.away="mobileMenuOpen = false">
            <a :href="basePath + 'index.html'" :class="isActive('index.html') ? 'nav-link-active' : 'nav-link-inactive'"
                class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Accueil</a>
            <a :href="basePath + 'pages/blog.html'"
                :class="isActive('blog.html') ? 'nav-link-active' : 'nav-link-inactive'"
                class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Blog</a>
            <a :href="basePath + 'pages/about.html'"
                :class="isActive('about.html') ? 'nav-link-active' : 'nav-link-inactive'"
                class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">À Propos</a>
            <a :href="basePath + 'pages/contact.html'"
                :class="isActive('contact.html') ? 'nav-link-active' : 'nav-link-inactive'"
                class="block py-3 nav-link border-b border-gray-100 dark:border-dark-border">Contact</a>
        </div>
    </nav>
</header>
